mitreTactic: TA0006
name: "AD: Golden Ticket Usage"
activityRationale: Adversaries who have the KRBTGT account password hash may forge Kerberos
  ticket-granting tickets (TGT), also known as a golden ticket. Golden tickets enable
  adversaries to generate authentication material for any account in Active Directory.
